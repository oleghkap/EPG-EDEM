name: Trim EPG Test

on:
  workflow_dispatch: # Позволяет запускать ворфлоу вручную кнопкой на сайте GitHub
  push:
    branches:
      - main
    paths:
      - 'trim_epg.py'

jobs:
  build-trim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run EPG trimmer script
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
        run: python trim_epg.py

      - name: Commit and push trimmed EPG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update trimmed EPG"
          file_pattern: epg_trimmed.xml.gz
