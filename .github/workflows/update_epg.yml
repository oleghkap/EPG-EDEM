name: Update All EPG

on:
  push:
    branches:
      - main
    paths:
      - 'clean_epg.py'
      - 'trim_epg.py'
      - '.github/workflows/update_epg.yml'

  workflow_dispatch:

  schedule:
    - cron: '7 0 * * *'

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Clean EPG Script
        run: python clean_epg.py

      - name: Run Trim EPG Script
        run: python trim_epg.py

      - name: Commit and Push EPG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add epg_custom.xml.gz epg_trimmed.xml.gz

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update EPG files [skip ci]"
            git push
          fi
