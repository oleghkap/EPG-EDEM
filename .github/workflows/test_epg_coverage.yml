name: Test EPG Coverage

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-coverage-test
  cancel-in-progress: false

jobs:
  test-epg-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run EPG coverage test
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
        run: python check_epg_coverage.py

      - name: Save results to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add channels_test.txt
          git add coverage_report.csv
          git add channel_coverage.csv
          git add epg_test_combined.xml.gz

          if git diff --cached --quiet; then
            echo "No changes in EPG test results."
            exit 0
          fi

          git commit -m "Update EPG coverage test results [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "EPG coverage results successfully pushed."
              exit 0
            fi

            echo "Push attempt $attempt failed."

            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done

          echo "Failed to push EPG coverage results after 3 attempts."
          exit 1
