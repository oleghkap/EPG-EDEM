name: Update All EPG

on:
  push:
    branches:
      - main
    paths:
      - 'clean_epg.py'
      - 'trim_epg.py'
      - '.github/workflows/update_epg.yml'

  schedule:
    - cron: '7 0 * * *'

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Clean EPG Script
        run: python clean_epg.py

      - name: Run Trim EPG Script
        run: python trim_epg.py

      - name: Commit and Push EPG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add epg_custom.xml.gz epg_trimmed.xml.gz

          if git diff --cached --quiet; then
            echo "No changes in EPG files."
            exit 0
          fi

          git commit -m "Auto-update EPG files [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "EPG files successfully pushed."
              exit 0
            fi

            echo "Push attempt $attempt failed."

            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done

          echo "Failed to push EPG files after 3 attempts."
          exit 1
